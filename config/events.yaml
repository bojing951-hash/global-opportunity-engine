# Scheduled event calendar (catalysts).
#
# Only events with a verifiable official source belong here. `verified: true`
# requires a source URL that was actually checked; unverified rows are treated
# as estimates and are labelled as such downstream.
#
# Schema:
#   id       unique, e.g. FOMC_2026-12-09
#   date     YYYY-MM-DD (decision/publication date in local time)
#   region   US | EA | JP | CN | UK | ...
#   type     central_bank | inflation | labour | gdp | policy | earnings_season | commodity
#   title    short description
#   affects  list of instrument ids (from config/universe.yaml) and/or curve ids
#   source   official calendar URL
#   verified whether source was checked
#
# The engine works with an empty calendar: the catalyst score defaults to a low
# value and no event-driven opportunity is generated. Populate with
#   python -m goe.cli events --check
# (which validates format/dates) after adding entries.

