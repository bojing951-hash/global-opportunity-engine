# Optional local evidence feeds for the research readiness gate.
# No vendor entitlement is assumed and no rows are fabricated. Missing/disabled
# files leave the hypothesis unknown. All feeds are point-in-time:
#   publication_time <= available_at <= decision as_of
# A forecast target may be in the future, but its publication may not.
consensus:
  enabled: false
  path: data/consensus_revisions.csv
  max_age_days: 90
ois:
  enabled: false
  path: data/policy_curve.csv
  curve_id: US_TREASURY_POLICY_PROXY
  currency: USD
  region: US
  curve_type: policy_path_proxy        # "ois" only for a licensed term-OIS curve
  provider: FRED
  units: percent
  max_age_days: 10
