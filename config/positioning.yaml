# CFTC Commitments of Traders positioning series.
#
# Report layout facts verified against the 2026 public files:
#   fin  (Traders in Financial Futures / TFF): columns Dealer_*, Asset_Mgr_*,
#        Lev_Money_*  -> metric net_asset_manager | net_lev_money
#   disagg (Disaggregated futures only): columns Prod_Merc_*, Swap_*, M_Money_*
#        -> metric net_managed_money (M_Money long - short)
#
# Net position = long - short, in contracts. Open interest is stored separately
# by the provider (series id suffix ":oi") so positioning can be normalised.
# Reports are as of Tuesday close, published Friday ~15:30 ET: the validation
# layer must respect that lag.
#
# Market names are exact strings from the CFTC files (verified 2026-11-13).

series:

  POS_SP500_LEV:
    name: E-mini S&P 500 leveraged money net position
    report: fin
    market: E-MINI S&P 500 - CHICAGO MERCANTILE EXCHANGE
    metric: net_lev_money
    maps_to: US_EQ_SPY
    importance: 0.6

  POS_SP500_AM:
    name: E-mini S&P 500 asset manager net position
    report: fin
    market: E-MINI S&P 500 - CHICAGO MERCANTILE EXCHANGE
    metric: net_asset_manager
    maps_to: US_EQ_SPY
    importance: 0.6

  POS_UST10Y_LEV:
