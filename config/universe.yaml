# Global tradable instrument universe.
#
# Fields
#   name         human readable name (Chinese + English)
#   asset_class  equity_index | equity_etf | sector_equity | fixed_income | credit
#                | fx | commodity | crypto | volatility
#   region       US CN HK JP EA UK DE FR IT ES CH KR TW IN BR CA AU MX TR WORLD
#   currency     quote currency of the traded instrument
#   source       data adapter id (see config/sources.yaml)
#   symbol       adapter specific symbol
#   importance   0..1 global importance weight used by the impact score.
#                Anchored on (a) share of global market value / daily turnover and
#                (b) how much the instrument transmits to other assets. Documented
#                in docs/SCORING.md; not tuned on returns.
#   liquidity    very_high | high | medium | low  (tradability of the proxy)
#   role         benchmark | sector | factor | macro_proxy | safe_haven | ...
#   benchmark    optional: instrument_id used as relative-strength benchmark
#
# Prices are downloaded as unadjusted close AND adjusted close. Return based
# analytics use adjusted close when available (dividends/splits), and the
# adjustment flag is stored with every row so the choice is auditable.

# Default benchmark per region (used for relative strength when an instrument
# does not declare its own benchmark). An instrument is never compared with
# itself: the resolver skips self-references.
benchmarks:
  US: US_EQ_SPY
  CN: CN_EQ_CSI300
  HK: HK_EQ_HSI
  JP: JP_EQ_N225
  EA: EA_EQ_SX5E
  DE: DE_EQ_DAX
  FR: FR_EQ_CAC
  UK: UK_EQ_FTSE
  KR: KR_EQ_KOSPI
  TW: TW_EQ_TAIEX
  IN: IN_EQ_SENSEX
  BR: BR_EQ_EWZ
  CA: CA_EQ_TSX
  AU: AU_EQ_ASX200
  MX: MX_EQ_IPC
  WORLD: WORLD_EQ_EFA

