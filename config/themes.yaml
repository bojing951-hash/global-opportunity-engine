# Exposure themes.
#
# Instruments in the same theme express the *same underlying phenomenon* through
# different wrappers (futures, ETF, index). The opportunity layer de-duplicates
# within a theme so that "gold fell" does not create five separate candidates
# (GC, GLD, GDX ...) and crowd out distinct ideas.
#
# Instruments not listed here get their own singleton theme (= instrument id).

version: "1.0"

themes:
  gold:            [CM_MET_GC, CM_ETF_GLD]
  gold_miners:     [CM_ETF_GDX]
  silver:          [CM_MET_SI, CM_ETF_SLV]
