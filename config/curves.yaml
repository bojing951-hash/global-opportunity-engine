# Yield curve definitions.
#
# Each curve is stored as indicator series with ids "{curve_id}:{tenor}".
# Tenors are normalised to years in the code: 1M=0.0833, 3M=0.25, 6M=0.5,
# 1Y=1 ... 30Y=30. Curve analytics (slope, curvature, inversion, level) are
# computed from these ids.

curves:

  UST:
    name: US Treasury par yield curve
    provider: treasury_us
    currency: USD
    region: US
    tier: official
    tenors: [1M, 2M, 3M, 4M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y]
    benchmark_tenors: [2Y, 10Y, 30Y]
    start_year: 2014            # 10 years of history for regime comparison
    notes: Par yields. 1M-4M from bill equivalents.

  JGB:
    name: Japan government bond yield curve
    provider: mof_japan
    currency: JPY
    region: JP
    tier: official
    tenors: [1Y, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 15Y, 20Y, 25Y, 30Y, 40Y]
    benchmark_tenors: [2Y, 10Y, 30Y]
    start_year: 2014
    notes: MOF publishes a business-day curve.

  EAC:
    name: Euro area AAA central government yield curve
    provider: ecb
    currency: EUR
    region: EA
    tier: official
    tenors: [3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]
    benchmark_tenors: [2Y, 10Y]
    start_year: 2014

  CN:
    name: China government bond yield curve
    provider: akshare_cn_bond
    currency: CNY
    region: CN
    tier: aggregator
    tenors: [2Y, 5Y, 10Y, 30Y]
    benchmark_tenors: [2Y, 10Y]
    start_year: 2014
    notes: >-
      ChinaBond curve redistributed via akshare. Coverage is limited to the
      tenors exposed by the upstream table.
