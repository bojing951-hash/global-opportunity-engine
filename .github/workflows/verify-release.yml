name: verify-release

on:
  push:
    branches: [architecture/research-v2, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Remove ignored build artifacts
        run: |
          echo "before clean:"; git status --porcelain --untracked-files=all
          # pip editable installs create ignored .egg-info/__pycache__/build dirs;
          # remove only untracked/ignored build output, never tracked evidence.
          git clean -fdx
          echo "after clean:"; git status --porcelain --untracked-files=all
      - name: Replay latest release proof (cross-OS)
        run: |
          PROOF="$(ls -1t audit/test_evidence/*.proof.json | head -1)"
          echo "replaying $PROOF"
          python -m goe.cli verify-release --proof "$PROOF"
