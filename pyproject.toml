[project]
name = "global-opportunity-engine"
version = "0.1.0"
description = "Global cross-asset investment opportunity discovery engine (upstream of investment-agent)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "yfinance>=0.2.40",
  "xlrd>=2.0",          # Shiller .xls parsing
  "akshare>=1.14",      # China government bond yields (optional at runtime)
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8.0"]

[project.scripts]
goe = "goe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests that require live network access (deselected in CI by default)",
  "slow: long-running tests",
]

[tool.setuptools.packages.find]
include = ["goe*"]
